[project]
name = "vibe-reading"
version = "0.1.0"
description = "中英双语电子书阅读器 - 上传 TXT 电子书, 后台调用 DeepSeek 翻译, 中 / 英 / 双语三种阅读模式"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Vibe Reading" }
]
keywords = ["fastapi", "bilingual", "reader", "deepseek", "translation"]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "jinja2>=3.1.3",
    "sqlalchemy[asyncio]>=2.0.25",
    "aiosqlite>=0.19.0",
    "openai>=1.50.0,<2.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
]

[tool.uv]
# 这是应用, 不打包成 wheel, 只用 uv 装依赖 + 运行
package = false
# 锁定 Python 版本 (会生成 .python-version 文件)
# managed = true
