<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Vibe Reading{% endblock %}</title>
    <script>
        // Theme initialization — runs before paint to avoid FOUC
        (function() {
            var theme = localStorage.getItem('vibe_theme') || 'vibe';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>

    <!-- TailwindCSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream:     'var(--color-cream)',
                        parchment: 'var(--color-parchment)',
                        linen:     'var(--color-linen)',
                        sand:      'var(--color-sand)',
                        stone:     'var(--color-stone)',
                        charcoal:  'var(--color-charcoal)',
                        ink:       'var(--color-ink)',
                        'warm-gray':'var(--color-warm-gray)',
                        'light-gray':'var(--color-light-gray)',
                        sage:      { DEFAULT: 'var(--color-sage)', light: 'var(--color-sage-light)' },
                        amber:     { DEFAULT: 'var(--color-amber)', light: 'var(--color-amber-light)' },
                        'red-muted':  { DEFAULT: 'var(--color-red-muted)', light: 'var(--color-red-light)' },
                        'blue-muted': { DEFAULT: 'var(--color-blue-muted)', light: 'var(--color-blue-light)' },
                    },
                    fontFamily: {
                        display: ['Cormorant Garamond', 'Noto Serif SC', 'Georgia', 'serif'],
                        body:    ['Lora', 'Noto Serif SC', 'Georgia', 'serif'],
                        ui:      ['DM Sans', 'Noto Serif SC', '-apple-system', 'sans-serif'],
                        mono:    ['JetBrains Mono', 'Menlo', 'monospace'],
                    },
                },
            },
        }
    </script>

    <!-- Alpine.js via CDN -->
    <script defer src="https://unpkg.com/alpinejs@3.13.5/dist/cdn.min.js"></script>

    <!-- Custom Design System -->
    <link rel="stylesheet" href="/static/style.css" />

    {% block head_extra %}{% endblock %}
</head>
<body>
    {% block nav %}
    <nav class="nav-bar">
        <div class="nav-inner">
            <a href="/" class="nav-brand">
                <span class="nav-brand-icon">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                    </svg>
                </span>
                <span>Vibe Reading</span>
            </a>
            <div class="flex items-center gap-3">
                <span class="nav-subtitle">沉浸式英语学习阅读</span>
                <div class="w-px h-4 bg-surface"></div>
                <button type="button" id="theme-toggle"
                        class="flex items-center gap-1 text-xs font-medium text-secondary hover:text-accent transition-colors"
                        title="切换主题">
                    <svg class="w-3.5 h-3.5" id="theme-icon-vibe" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9.53 16.122a3 3 0 00-5.78 1.128 2.25 2.25 0 01-2.4 2.245 4.5 4.5 0 008.4-2.245c0-.399-.078-.78-.22-1.128zm0 0a15.998 15.998 0 003.388-1.62m-5.043-.025a15.994 15.994 0 011.622-3.395m3.42 3.42a15.995 15.995 0 004.764-4.648l3.876-5.814a1.151 1.151 0 00-1.597-1.597L14.146 6.32a15.996 15.996 0 00-4.649 4.763m3.42 3.42a6.776 6.776 0 00-3.42-3.42"/>
                    </svg>
                    <svg class="w-3.5 h-3.5 hidden" id="theme-icon-weread" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9.004 9.004 0 008.716-6.747M12 21a9.004 9.004 0 01-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a8.997 8.997 0 017.843 4.582M12 3a8.997 8.997 0 00-7.843 4.582m15.686 0A11.953 11.953 0 0112 10.5c-2.998 0-5.74-1.1-7.843-2.918m15.686 0A8.959 8.959 0 0121 12c0 .778-.099 1.533-.284 2.253m0 0A17.919 17.919 0 0112 16.5c-3.162 0-6.133-.815-8.716-2.247m0 0A9.015 9.015 0 013 12c0-1.605.42-3.113 1.157-4.418"/>
                    </svg>
                    <span id="theme-label">原木</span>
                </button>
            </div>
        </div>
    </nav>
    {% endblock %}

    <main class="page-main">
        {% block content %}{% endblock %}
    </main>

    {% block footer_extra %}{% endblock %}

    <script>
        (function() {
            var theme = localStorage.getItem('vibe_theme') || 'vibe';
            var btn = document.getElementById('theme-toggle');
            var label = document.getElementById('theme-label');
            var iconVibe = document.getElementById('theme-icon-vibe');
            var iconWeread = document.getElementById('theme-icon-weread');

            function updateUI(t) {
                var isVibe = t === 'vibe';
                if (iconVibe) iconVibe.classList.toggle('hidden', !isVibe);
                if (iconWeread) iconWeread.classList.toggle('hidden', isVibe);
                if (label) label.textContent = isVibe ? '原木' : '青简';
            }

            updateUI(theme);

            if (btn) {
                btn.addEventListener('click', function() {
                    var current = localStorage.getItem('vibe_theme') || 'vibe';
                    var next = current === 'vibe' ? 'weread' : 'vibe';
                    localStorage.setItem('vibe_theme', next);
                    document.documentElement.setAttribute('data-theme', next);
                    updateUI(next);
                });
            }
        })();
    </script>
</body>
</html>
