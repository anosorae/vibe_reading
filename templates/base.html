<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Vibe Reading{% endblock %}</title>

    <!-- TailwindCSS via CDN (免构建) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Alpine.js via CDN (免构建) -->
    <script defer src="https://unpkg.com/alpinejs@3.13.5/dist/cdn.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }
        .mode-btn-active {
            background-color: #ffffff;
            color: #4f46e5;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
    <nav class="bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
            <a href="/" class="text-xl font-bold text-indigo-600 flex items-center gap-2">
                <span>📚</span>
                <span>Vibe Reading</span>
            </a>
            <span class="text-xs text-slate-400">中英双语电子书阅读器</span>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
