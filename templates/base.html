<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Vibe Reading{% endblock %}</title>

    <!-- TailwindCSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream:     '#FAF7F2',
                        parchment: '#F3EDE4',
                        linen:     '#EDE7DC',
                        sand:      '#D9D0C3',
                        stone:     '#B8AFA3',
                        ink:       '#1A1714',
                        sienna:    { DEFAULT: '#B85C38', light: '#D4845A', dark: '#8F4528' },
                        sage:      { DEFAULT: '#6B8F71', light: '#E8F0E4' },
                        amber:     { DEFAULT: '#C69B3E', light: '#FDF6E3' },
                        'red-muted':  { DEFAULT: '#C45B4A', light: '#FCEAE7' },
                        'blue-muted': { DEFAULT: '#5B7FA8', light: '#EAF0F7' },
                        'warm-gray':  '#6B635B',
                    },
                    fontFamily: {
                        display: ['Cormorant Garamond', 'Noto Serif SC', 'Georgia', 'serif'],
                        body:    ['Lora', 'Noto Serif SC', 'Georgia', 'serif'],
                        ui:      ['DM Sans', 'Noto Serif SC', '-apple-system', 'sans-serif'],
                        mono:    ['JetBrains Mono', 'Menlo', 'monospace'],
                    },
                },
            },
        }
    </script>

    <!-- Alpine.js via CDN -->
    <script defer src="https://unpkg.com/alpinejs@3.13.5/dist/cdn.min.js"></script>

    <!-- Custom Design System -->
    <link rel="stylesheet" href="/static/style.css" />

    {% block head_extra %}{% endblock %}
</head>
<body>
    {% block nav %}
    <nav class="nav-bar">
        <div class="nav-inner">
            <a href="/" class="nav-brand">
                <span class="nav-brand-icon">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
                        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
                    </svg>
                </span>
                <span>Vibe Reading</span>
            </a>
            <span class="nav-subtitle">沉浸式英语学习阅读</span>
        </div>
    </nav>
    {% endblock %}

    <main class="max-w-4xl mx-auto px-6 py-10">
        {% block content %}{% endblock %}
    </main>

    {% block footer_extra %}{% endblock %}
</body>
</html>
