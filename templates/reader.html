{% extends "base.html" %}
{% block title %}{{ book.title }} — Vibe Reading{% endblock %}
{% block nav %}{% endblock %}

{% block head_extra %}
<style>
    body {
        background: var(--color-cream);
        background-image:
            radial-gradient(ellipse 80% 60% at 50% 0%, rgba(243, 237, 228, 0.8) 0%, transparent 70%),
            radial-gradient(ellipse 60% 40% at 50% 100%, rgba(237, 231, 220, 0.5) 0%, transparent 60%);
    }
    body::before {
        opacity: 0.02;
    }
</style>
{% endblock %}

{% block content %}
<script>
    window.VIBE_READING = {
        bookId: {{ book.id }},
        chapterMaxChars: {{ chapter_max_chars }},
        chapters: {{ chapters | tojson | safe }},
        lastReadChapterId: {{ book.last_read_chapter_id | tojson | safe }},
    };
</script>

<div x-data="reader">

    <!-- Toolbar -->
    <div x-show="navVisible"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="-translate-y-full opacity-0"
         x-transition:enter-end="translate-y-0 opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="translate-y-0 opacity-100"
         x-transition:leave-end="-translate-y-full opacity-0"
         class="reader-toolbar">
        <div class="toolbar-inner">
            <div class="toolbar-left">
                <a href="/" class="btn btn-ghost btn-sm" title="返回书架">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
                    </svg>
                </a>
                <div class="w-px h-5 bg-linen"></div>
                <h1 class="font-display text-sm font-semibold text-ink truncate max-w-[200px]">{{ book.title }}</h1>
            </div>
            <div class="toolbar-right">
                <button type="button" @click="switchMode('zh')"
                        :class="mode === 'zh' ? 'active' : ''"
                        class="mode-btn">中文</button>
                <button type="button" @click="switchMode('en')"
                        :class="mode === 'en' ? 'active' : ''"
                        class="mode-btn">英文</button>
                <div class="toolbar-divider"></div>
                <button type="button" @click="catalogOpen = true"
                        class="btn btn-ghost btn-sm">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
                    </svg>
                    <span class="hidden sm:inline">目录</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Catalog Modal -->
    <div x-show="catalogOpen"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @keydown.escape.window="catalogOpen = false"
         class="modal-overlay" style="display:none">
        <div class="absolute inset-0" @click="catalogOpen = false"></div>
        <div class="modal-content animate-scale-in"
             x-transition:enter="transition ease-out duration-200"
             x-transition:enter-start="opacity-0 scale-95 translate-y-4"
             x-transition:enter-end="opacity-100 scale-100 translate-y-0">
            <div class="modal-header">
                <h2 class="modal-title">目录</h2>
                <button @click="catalogOpen = false" class="btn btn-ghost btn-sm p-1.5">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <template x-for="(group, groupIndex) in catalogGroups" :key="groupIndex">
                    <div class="catalog-group">
                        <!-- 有 section 的分组：可折叠 -->
                        <template x-if="group.section">
                            <div>
                                <div @click="toggleSection(groupIndex)"
                                     class="catalog-section-title">
                                    <svg class="catalog-section-arrow" :class="group.expanded ? '' : 'collapsed'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
                                    </svg>
                                    <span x-text="group.section"></span>
                                    <span class="catalog-section-count" x-text="'(' + group.chapters.length + ')'"></span>
                                </div>
                                <div x-show="group.expanded" class="catalog-section-chapters">
                                    <template x-for="ch in group.chapters" :key="ch.id">
                                        <button @click="navigateTo(ch.id); catalogOpen = false"
                                                :class="activeChapterId === ch.id ? 'active' : ''"
                                                class="catalog-item">
                                            <span :id="'cat-dot-' + ch.id"
                                                  :class="'catalog-dot dot-' + ch.status"></span>
                                            <span class="catalog-title" x-text="ch.title"></span>
                                        </button>
                                    </template>
                                </div>
                            </div>
                        </template>
                        <!-- 无 section 的分组：直接显示，不折叠 -->
                        <template x-if="!group.section">
                            <div class="catalog-section-chapters">
                                <template x-for="ch in group.chapters" :key="ch.id">
                                    <button @click="navigateTo(ch.id); catalogOpen = false"
                                            :class="activeChapterId === ch.id ? 'active' : ''"
                                            class="catalog-item">
                                        <span :id="'cat-dot-' + ch.id"
                                              :class="'catalog-dot dot-' + ch.status"></span>
                                        <span class="catalog-title" x-text="ch.title"></span>
                                    </button>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- Chapter Content -->
    <div class="reader-container py-8">
        <article class="chapter-card">
            <header class="chapter-header">
                <div x-show="currentSection" class="chapter-section animate-fade-in" x-text="currentSection"></div>
                <h2 class="chapter-title animate-fade-in" x-text="currentTitle"></h2>
                <div class="flex items-center gap-2 mt-4">
                    <span id="active-status-badge"
                          class="badge badge-pending animate-fade-in delay-1">加载中…</span>
                    <button id="active-translate-btn" type="button"
                            class="btn btn-primary btn-sm animate-fade-in delay-2"
                            style="display:none"
                            @click="translateChapter(activeChapterId)">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 21l5.25-11.25L21 21m-9-3h7.5M3 5.621a48.474 48.474 0 016-.371m0 0c1.12 0 2.233.038 3.334.114M9 5.25V3m3.334 2.364C11.176 10.658 7.69 15.08 3 17.502m9.334-12.138c.896.061 1.785.147 2.666.257m-4.589 8.495a18.023 18.023 0 01-3.827-5.802"/>
                        </svg>
                        翻译本章
                    </button>
                    <button id="active-retry-btn" type="button"
                            class="btn btn-ghost btn-sm p-1.5 animate-fade-in delay-2"
                            style="display:none"
                            @click="translateChapter(activeChapterId)"
                            title="重新翻译">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182"/>
                        </svg>
                    </button>
                </div>
            </header>

            <div id="chapter-body" class="chapter-body">
                <div class="flex flex-col items-center justify-center py-16 gap-3">
                    <div class="w-8 h-8 border-2 border-sand border-t-sienna rounded-full animate-spin"></div>
                    <span class="text-sm text-stone">加载中…</span>
                </div>
            </div>

            <footer class="chapter-footer">
                <a href="#" @click.prevent="prevChapter" x-show="hasPrev"
                   class="chapter-nav-link">
                    <svg class="chapter-nav-arrow" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/>
                    </svg>
                    <span class="chapter-nav-title" x-text="prevTitle"></span>
                </a>
                <span x-show="!hasPrev"></span>
                <a href="#" @click.prevent="nextChapter" x-show="hasNext"
                   class="chapter-nav-link" style="flex-direction: row-reverse;">
                    <svg class="chapter-nav-arrow" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5"/>
                    </svg>
                    <span class="chapter-nav-title" x-text="nextTitle"></span>
                </a>
                <span x-show="!hasNext"></span>
            </footer>
        </article>

        <!-- Bottom breathing space -->
        <div class="py-16"></div>
    </div>
</div>

<script>
    function escapeHtml(s) {
        const d = document.createElement('div');
        d.appendChild(document.createTextNode(s));
        return d.innerHTML;
    }

    document.addEventListener('alpine:init', () => {
        Alpine.data('reader', () => ({
            bookId: window.VIBE_READING.bookId,
            chapterMaxChars: window.VIBE_READING.chapterMaxChars,
            chapters: window.VIBE_READING.chapters,
            mode: 'zh',
            activeChapterId: null,
            currentTitle: '',
            currentSection: '',
            hasPrev: false,
            hasNext: false,
            prevTitle: '',
            nextTitle: '',
            catalogOpen: false,
            chapterStatus: {},
            navVisible: true,
            catalogGroups: [],
            _timer: null,
            _streaming: false,
            _lastScrollY: 0,

            init() {
                for (const ch of this.chapters) {
                    this.chapterStatus[ch.id] = ch;
                }
                // 初始化目录分组
                this.buildCatalogGroups();
                // Scroll hide/show toolbar
                let ticking = false;
                window.addEventListener('scroll', () => {
                    if (ticking) return;
                    ticking = true;
                    requestAnimationFrame(() => {
                        const y = window.scrollY;
                        if (y < 10) {
                            this.navVisible = true;
                        } else if (y > this._lastScrollY + 8) {
                            this.navVisible = false;
                        } else if (y < this._lastScrollY - 8) {
                            this.navVisible = true;
                        }
                        this._lastScrollY = y;
                        ticking = false;
                    });
                }, { passive: true });

                // Restore reading progress
                let startId = window.VIBE_READING.lastReadChapterId;
                if (!startId || !this.chapters.some(c => c.id === startId)) {
                    startId = this.chapters[0] ? this.chapters[0].id : null;
                }
                if (startId) {
                    this.navigateTo(startId);
                }
                this.fetchStatus();
            },

            buildCatalogGroups() {
                const groups = [];
                let currentGroup = null;
                
                for (const ch of this.chapters) {
                    if (ch.section && (!currentGroup || currentGroup.section !== ch.section)) {
                        // 遇到新的 section，创建新 group，默认折叠
                        currentGroup = { section: ch.section, chapters: [], expanded: false };
                        groups.push(currentGroup);
                    } else if (!ch.section && !currentGroup) {
                        // 第一个章节没有 section，创建无 section group
                        currentGroup = { section: null, chapters: [], expanded: true };
                        groups.push(currentGroup);
                    }
                    // 所有章节都添加到 currentGroup
                    currentGroup.chapters.push(ch);
                }
                
                this.catalogGroups = groups;
                // 展开当前章节所在的 group
                this.expandCurrentChapterGroup();
            },

            expandCurrentChapterGroup() {
                if (!this.activeChapterId) return;
                for (let i = 0; i < this.catalogGroups.length; i++) {
                    const group = this.catalogGroups[i];
                    if (group.chapters.some(ch => ch.id === this.activeChapterId)) {
                        group.expanded = true;
                        break;
                    }
                }
            },

            toggleSection(groupIndex) {
                const group = this.catalogGroups[groupIndex];
                if (group) {
                    group.expanded = !group.expanded;
                }
            },

            navigateTo(id) {
                if (this.activeChapterId === id) return;
                this.activeChapterId = id;
                const ch = this.chapters.find(c => c.id === id);
                this.currentTitle = ch ? ch.title : '';
                this.currentSection = ch ? (ch.section || '') : '';

                // 展开当前章节所在的 group
                this.expandCurrentChapterGroup();

                // Save progress
                if (ch) {
                    fetch('/api/reading-progress/' + this.bookId, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({chapter_id: ch.id})
                    }).catch(() => {});
                }

                this.hasPrev = ch ? !!ch.prev_chapter_id : false;
                this.hasNext = ch ? !!ch.next_chapter_id : false;
                this.prevTitle = '';
                this.nextTitle = '';
                if (ch && ch.prev_chapter_id) {
                    const prev = this.chapters.find(c => c.id === ch.prev_chapter_id);
                    if (prev) this.prevTitle = prev.title;
                }
                if (ch && ch.next_chapter_id) {
                    const next = this.chapters.find(c => c.id === ch.next_chapter_id);
                    if (next) this.nextTitle = next.title;
                }

                this.updateActiveBadge();
                this.loadChapter(id);
                if (this.mode !== 'zh') {
                    this.maybeTranslateChapter(id);
                }

                // Scroll to top smoothly
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            prevChapter() {
                const ch = this.chapters.find(c => c.id === this.activeChapterId);
                if (ch && ch.prev_chapter_id) this.navigateTo(ch.prev_chapter_id);
            },

            nextChapter() {
                const ch = this.chapters.find(c => c.id === this.activeChapterId);
                if (ch && ch.next_chapter_id) {
                    this.navigateTo(ch.next_chapter_id);
                    this.maybeTranslateNext(ch.next_chapter_id);
                }
            },

            switchMode(m) {
                if (this.mode === m) return;
                this.mode = m;
                const id = this.activeChapterId;
                if (id) {
                    this.loadChapter(id);
                    if (m !== 'zh') this.maybeTranslateChapter(id);
                }
                this.updateActiveBadge();
            },

            async loadChapter(id) {
                const container = document.getElementById('chapter-body');
                if (!container) return;
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-16 gap-3">
                        <div class="w-8 h-8 border-2 border-sand border-t-sienna rounded-full animate-spin"></div>
                        <span class="text-sm text-stone">加载中…</span>
                    </div>`;
                try {
                    const res = await fetch('/api/chapter/' + id);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    this.renderChapter(container, data);
                } catch (e) {
                    container.innerHTML = `
                        <div class="flex flex-col items-center justify-center py-16 gap-3">
                            <svg class="w-8 h-8 text-red-muted" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
                            </svg>
                            <span class="text-sm text-red-muted">加载失败: ${escapeHtml(e.message)}</span>
                        </div>`;
                }
            },

            renderChapter(container, chapter) {
                const content = chapter.content || '';
                const translated = chapter.translated_content || '';

                if (this.mode === 'zh') {
                    this.renderZh(container, content);
                } else {
                    this.renderEn(container, content, translated);
                }
            },

            renderZh(container, content) {
                const lines = content.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
                if (!lines.length) {
                    container.innerHTML = `
                        <div class="text-center py-16">
                            <span class="text-stone text-sm">(空章节)</span>
                        </div>`;
                    return;
                }
                container.innerHTML = lines.map((p, i) =>
                    `<p class="para-zh" style="animation: fadeInUp 0.4s ease ${i * 40}ms both">${escapeHtml(p)}</p>`
                ).join('');
            },

            renderEn(container, content, translated) {
                if (!translated) {
                    container.innerHTML = `
                        <div class="flex flex-col items-center justify-center py-16 gap-3">
                            <div class="w-8 h-8 border-2 border-sand border-t-sienna rounded-full animate-spin"></div>
                            <span class="text-sm text-stone">等待翻译…</span>
                        </div>`;
                    return;
                }

                const cnParas = content.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);

                const parsed = [];
                const regex = /\[(\d+)\]\s*/g;
                let match;
                let lastIndex = 0;
                while ((match = regex.exec(translated)) !== null) {
                    if (parsed.length > 0) {
                        parsed[parsed.length - 1].text = translated.slice(lastIndex, match.index).trim();
                    }
                    parsed.push({ marker: parseInt(match[1]), text: '' });
                    lastIndex = match.index + match[0].length;
                }
                if (parsed.length > 0) {
                    parsed[parsed.length - 1].text = translated.slice(lastIndex).trim();
                } else {
                    parsed.push({ marker: null, text: translated.trim() });
                }

                const blocks = [];
                let idx = 0;
                for (const ep of parsed) {
                    const enHtml = escapeHtml(ep.text);
                    let cnHtml = '';
                    if (ep.marker !== null && ep.marker >= 1 && ep.marker <= cnParas.length) {
                        cnHtml = escapeHtml(cnParas[ep.marker - 1]);
                    }
                    const delay = idx * 30;
                    blocks.push(
                        `<p class="para-en" style="animation: fadeInUp 0.35s ease ${delay}ms both" onclick="const orig=this.nextElementSibling;orig.classList.toggle('visible')">${enHtml}</p>`
                        + `<p class="para-original">${cnHtml}</p>`
                    );
                    idx++;
                }
                container.innerHTML = blocks.join('');
            },

            _renderZhFallback(content) {
                const lines = content.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
                return lines.map(p =>
                    '<p class="para-zh">' + escapeHtml(p) + '</p>'
                ).join('');
            },

            canTranslate(chapterId) {
                if (this.mode === 'zh') return false;
                if (this._streaming) return false;
                const ch = this.chapterStatus[chapterId];
                if (!ch) return false;
                return ch.status !== 'done' && ch.status !== 'empty';
            },

            async translateChapter(chapterId) {
                if (this._streaming) return;
                this._streaming = true;
                const container = document.getElementById('chapter-body');

                // Reset chapter status
                await fetch('/api/reset-chapter/' + chapterId, { method: 'POST' });
                if (this.chapterStatus[chapterId]) {
                    this.chapterStatus[chapterId].status = 'pending';
                }

                // Mark as in progress
                if (this.chapterStatus[chapterId]) {
                    this.chapterStatus[chapterId].status = 'in_progress';
                }
                this.updateActiveBadge();
                
                // Start polling if not already running
                if (!this._timer) {
                    this._timer = setInterval(() => this.fetchStatus(), 3000);
                }
                if (container) {
                    container.innerHTML = `
                        <div class="flex flex-col items-center justify-center py-16 gap-4">
                            <div class="relative w-12 h-12">
                                <div class="absolute inset-0 border-2 border-linen rounded-full"></div>
                                <div class="absolute inset-0 border-2 border-transparent border-t-sienna rounded-full animate-spin"></div>
                            </div>
                            <div class="text-center">
                                <span class="text-sm font-medium text-charcoal block">翻译中</span>
                                <span class="text-xs text-stone mt-1 block">正在调用 AI 翻译引擎…</span>
                            </div>
                        </div>`;
                }

                let accumulated = '';
                try {
                    const res = await fetch('/translate/stream/' + chapterId, { method: 'POST' });
                    if (!res.ok) {
                        const err = await res.json().catch(() => ({}));
                        throw new Error(err.detail || err.reason || 'HTTP ' + res.status);
                    }
                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop();

                        for (const line of lines) {
                            if (!line.startsWith('data: ')) continue;
                            let evt;
                            try { evt = JSON.parse(line.slice(6)); } catch { continue; }

                            if (evt.type === 'chunk') {
                                accumulated += evt.text;
                                if (container) {
                                    container.innerHTML = `
                                        <div class="font-body text-charcoal leading-relaxed whitespace-pre-wrap text-[0.9375rem]">${escapeHtml(accumulated)}</div>
                                        <div class="mt-4 pt-4 border-t border-linen">
                                            <div class="flex items-center gap-2 text-xs text-stone">
                                                <div class="w-1.5 h-1.5 rounded-full bg-sienna animate-pulse"></div>
                                                翻译中…
                                            </div>
                                        </div>`;
                                }
                            } else if (evt.type === 'error') {
                                throw new Error(evt.reason);
                            }
                        }
                    }

                    this._streaming = false;
                    if (this.chapterStatus[chapterId]) {
                        this.chapterStatus[chapterId].status = 'done';
                    }
                    this.updateActiveBadge();
                    await this.fetchStatus();
                    this.loadChapter(chapterId);

                } catch (e) {
                    console.error('translateChapter failed:', e);
                    this._streaming = false;
                    if (this.chapterStatus[chapterId]) {
                        this.chapterStatus[chapterId].status = 'failed';
                    }
                    this.updateActiveBadge();
                    if (container) {
                        container.innerHTML = `
                            <div class="flex flex-col items-center justify-center py-16 gap-3">
                                <svg class="w-8 h-8 text-red-muted" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
                                </svg>
                                <span class="text-sm text-red-muted">翻译失败: ${escapeHtml(e.message)}</span>
                            </div>`;
                    }
                }
            },

            maybeTranslateNext(chapterId) {
                if (chapterId == null) return;
                if (this.mode === 'zh') return;
                if (this._streaming) return;
                const ch = this.chapterStatus[chapterId];
                if (!ch) return;
                if (ch.char_count > this.chapterMaxChars) return;
                if (ch.status === 'pending' || ch.status === 'failed') {
                    this.translateChapter(chapterId);
                }
            },

            maybeTranslateChapter(chapterId) {
                if (chapterId == null) return;
                if (this._streaming) return;
                const ch = this.chapterStatus[chapterId];
                if (!ch) return;
                if (ch.char_count > this.chapterMaxChars) return;
                if (ch.status === 'in_progress' || ch.status === 'done') return;
                if (ch.status === 'pending' || ch.status === 'failed') {
                    this.translateChapter(chapterId);
                }
            },

            async fetchStatus() {
                try {
                    const res = await fetch('/api/chapter-status/' + this.bookId);
                    if (!res.ok) return;
                    const data = await res.json();
                    let hasInProgress = false;
                    for (const ch of data.chapters) {
                        const prev = this.chapterStatus[ch.id];
                        this.chapterStatus[ch.id] = ch;
                        if (!prev || prev.status !== ch.status) {
                            this.updateBadge(ch);
                            if (ch.id === this.activeChapterId && ch.status === 'done' && prev && prev.status !== 'done') {
                                this.loadChapter(ch.id);
                            }
                        }
                        if (ch.status === 'in_progress') {
                            hasInProgress = true;
                        }
                    }
                    if (!hasInProgress && this._timer) {
                        clearInterval(this._timer);
                        this._timer = null;
                    } else if (hasInProgress && !this._timer) {
                        this._timer = setInterval(() => this.fetchStatus(), 3000);
                    }
                } catch (e) { /* ignore */ }
            },

            updateBadge(ch) {
                const dot = document.getElementById('cat-dot-' + ch.id);
                if (dot) {
                    dot.className = 'catalog-dot dot-' + ch.status;
                }
                if (ch.id === this.activeChapterId) {
                    this.updateActiveBadge();
                }
            },

            updateActiveBadge() {
                const ch = this.chapterStatus[this.activeChapterId];
                if (!ch) return;
                const badge = document.getElementById('active-status-badge');
                const btn = document.getElementById('active-translate-btn');
                const retryBtn = document.getElementById('active-retry-btn');

                // Chinese mode: hide translation controls
                if (this.mode === 'zh') {
                    if (badge) badge.style.display = 'none';
                    if (btn) btn.style.display = 'none';
                    if (retryBtn) retryBtn.style.display = 'none';
                    return;
                }

                if (badge) {
                    badge.textContent = this.badgeText(ch);
                    badge.className = 'badge ' + this.badgeClass(ch);
                    badge.style.display = '';
                }
                if (btn) {
                    btn.style.display = this.canTranslate(this.activeChapterId) ? '' : 'none';
                }
                if (retryBtn) {
                    retryBtn.style.display = (ch.status === 'done' || ch.status === 'failed') ? '' : 'none';
                }
            },

            dotClass(ch) {
                if (ch.char_count > this.chapterMaxChars) return 'dot-too_long';
                switch (ch.status) {
                    case 'done':        return 'dot-done';
                    case 'in_progress': return 'dot-in_progress';
                    case 'failed':      return 'dot-failed';
                    case 'too_long':    return 'dot-too_long';
                    case 'empty':       return 'dot-empty';
                    default:            return 'dot-pending';
                }
            },

            badgeText(ch) {
                if (ch.char_count > this.chapterMaxChars) {
                    return '过长 · ' + ch.char_count.toLocaleString() + ' 字符';
                }
                switch (ch.status) {
                    case 'pending':     return '待翻译';
                    case 'in_progress': return '翻译中…';
                    case 'done':        return '已翻译';
                    case 'failed':      return '翻译失败';
                    case 'too_long':    return '过长 · ' + ch.char_count.toLocaleString() + ' 字符';
                    case 'empty':       return '空章节';
                    default:            return ch.status;
                }
            },

            badgeClass(ch) {
                if (ch.char_count > this.chapterMaxChars) return 'badge-too-long';
                switch (ch.status) {
                    case 'done':        return 'badge-done';
                    case 'in_progress': return 'badge-in-progress';
                    case 'failed':      return 'badge-failed';
                    case 'too_long':    return 'badge-too-long';
                    case 'empty':       return 'badge-pending';
                    default:            return 'badge-pending';
                }
            }
        }));
    });
</script>
{% endblock %}
