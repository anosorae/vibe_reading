{% extends "base.html" %}
{% block title %}{{ book.title }} - Vibe Reading{% endblock %}

{% block content %}
<!--
    Design:
    - Catalog dropdown at top for TOC navigation
    - Single chapter view, content loaded on navigation
    - Modes via body class (unchanged)
    - Status polling updates both catalog dots and active chapter badge
-->

<script>
    window.VIBE_READING = {
        bookId: {{ book.id }},
        chapterMaxChars: {{ chapter_max_chars }},
        chapters: {{ chapters | tojson | safe }},
    };
</script>

<div x-data="reader" class="space-y-6">
    <!-- Top bar -->
    <div class="bg-white rounded-lg shadow-sm p-6 sticky top-0 z-10 backdrop-blur bg-white/90">
        <div class="flex items-center justify-between mb-4 gap-4">
            <div class="min-w-0">
                <a href="/" class="text-xs text-slate-500 hover:text-indigo-600">← 返回书架</a>
                <h1 class="text-2xl font-bold text-slate-800 mt-1 truncate">{{ book.title }}</h1>
            </div>
            <!-- Catalog dropdown -->
            <div class="relative" x-data="{ open: false }">
                <button @click="open = !open"
                        class="flex items-center gap-1 px-3 py-1.5 text-sm font-medium rounded-lg bg-slate-100 hover:bg-slate-200 transition shrink-0">
                    <span>📖 目录</span>
                    <span :class="open ? 'rotate-180' : ''" class="transition">▼</span>
                </button>
                <div x-show="open" @click.away="open = false" x-transition
                     class="absolute right-0 mt-2 w-64 bg-white rounded-lg shadow-lg border border-slate-200 max-h-96 overflow-y-auto z-50">
                    <div class="py-1">
                        <template x-for="ch in chapters" :key="ch.id">
                            <a href="#"
                               @click.prevent="navigateTo(ch.id); open = false"
                               :class="activeChapterId === ch.id ? 'bg-indigo-50 text-indigo-700 font-semibold' : 'text-slate-600 hover:bg-slate-50'"
                               class="block px-4 py-2 text-sm flex items-center justify-between">
                                <span x-text="ch.title"></span>
                                <span :id="'cat-dot-' + ch.id" class="w-2 h-2 rounded-full flex-shrink-0"></span>
                            </a>
                        </template>
                    </div>
                </div>
            </div>
        </div>

        <div class="inline-flex bg-slate-100 rounded-full p-1 gap-1">
            <button type="button" @click="switchMode('zh')"  :class="mode === 'zh'  ? 'mode-btn-active' : ''" class="px-4 py-1.5 text-sm font-medium rounded-full transition text-slate-600 hover:text-slate-800">纯中文</button>
            <button type="button" @click="switchMode('en')"  :class="mode === 'en'  ? 'mode-btn-active' : ''" class="px-4 py-1.5 text-sm font-medium rounded-full transition text-slate-600 hover:text-slate-800">纯英文</button>
            <button type="button" @click="switchMode('both')" :class="mode === 'both' ? 'mode-btn-active' : ''" class="px-4 py-1.5 text-sm font-medium rounded-full transition text-slate-600 hover:text-slate-800">中英双语</button>
        </div>
    </div>

    <!-- Active chapter view -->
    <article class="bg-white rounded-lg shadow-sm p-6 sm:p-8">
        <header class="mb-4 pb-3 border-b border-slate-100">
            <h2 class="text-lg font-bold text-slate-800" x-text="currentTitle"></h2>
            <div class="mt-2 flex items-center gap-2 flex-wrap">
                <span id="active-status-badge" class="status-badge text-xs px-2 py-0.5 rounded-full font-medium bg-slate-100 text-slate-500">加载中…</span>
                <button id="active-translate-btn" type="button"
                        class="translate-btn text-xs px-3 py-1 font-medium bg-indigo-600 text-white rounded-full hover:bg-indigo-700 transition shadow-sm"
                        style="display:none"
                        @click="translateChapter(activeChapterId)">翻译本章</button>
            </div>
        </header>
        <div id="chapter-body" class="space-y-4"></div>

        <div class="mt-6 pt-4 border-t border-slate-100 flex justify-between">
            <a href="#" @click.prevent="prevChapter" x-show="hasPrev"
               class="text-sm text-indigo-600 hover:text-indigo-800 inline-flex items-center gap-1">
                <span class="text-base">↑</span> <span>上一章</span>
            </a>
            <a href="#" @click.prevent="nextChapter" x-show="hasNext"
               class="text-sm text-indigo-600 hover:text-indigo-800 inline-flex items-center gap-1">
                <span>下一章</span> <span class="text-base">↓</span>
            </a>
        </div>
    </article>

    <p class="text-center text-xs text-slate-400 pt-2 pb-8">
        纯英文模式下, 段落加载后点击英文段可展开中文 · 在「英文/双语」模式通过目录或下一章跳转时可自动预热翻译
    </p>
</div>

<style>
    .paragraph-en { display: none; }
    .paragraph-zh { display: block; }
    body.mode-en  .paragraph-zh { display: none; }
    body.mode-en  .paragraph-en { display: block; cursor: pointer; }
    body.mode-en  .paragraph-en:hover { color: #4f46e5; }
    body.mode-en  .paragraph[data-expanded="1"] .paragraph-zh { display: block; }
    body.mode-both .paragraph-en { display: block; font-style: italic; }
</style>

<script>
    function escapeHtml(s) {
        return String(s == null ? '' : s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    document.addEventListener('alpine:init', () => {
        const cfg = window.VIBE_READING || {};
        Alpine.data('reader', () => ({
            bookId: cfg.bookId,
            mode: 'zh',
            chapterMaxChars: cfg.chapterMaxChars,
            chapters: cfg.chapters || [],
            chapterStatus: {},
            activeChapterId: null,
            _timer: null,

            get hasPrev() {
                const ch = this.chapters.find(c => c.id === this.activeChapterId);
                return ch && ch.prev_chapter_id != null;
            },
            get hasNext() {
                const ch = this.chapters.find(c => c.id === this.activeChapterId);
                return ch && ch.next_chapter_id != null;
            },
            get currentTitle() {
                const ch = this.chapters.find(c => c.id === this.activeChapterId);
                return ch ? ch.title : '';
            },

            init() {
                document.body.classList.add('mode-zh');
                this.fetchStatus();
                if (this.chapters.length > 0) {
                    this.navigateTo(this.chapters[0].id);
                }
                document.addEventListener('click', (e) => {
                    if (this.mode !== 'en') return;
                    const p = e.target.closest('.paragraph');
                    if (!p) return;
                    if (e.target.closest('.paragraph-en')) {
                        p.dataset.expanded = p.dataset.expanded === '1' ? '0' : '1';
                    }
                });
            },
            destroy() {
                if (this._timer) clearInterval(this._timer);
            },
            switchMode(m) {
                this.mode = m;
                document.body.classList.remove('mode-zh', 'mode-en', 'mode-both');
                document.body.classList.add('mode-' + m);
            },
            navigateTo(id) {
                this.activeChapterId = id;
                this.loadChapter(id);
                this.updateActiveBadge();
            },
            prevChapter() {
                const ch = this.chapters.find(c => c.id === this.activeChapterId);
                if (ch && ch.prev_chapter_id != null) {
                    this.navigateTo(ch.prev_chapter_id);
                }
            },
            nextChapter() {
                const ch = this.chapters.find(c => c.id === this.activeChapterId);
                if (ch && ch.next_chapter_id != null) {
                    this.navigateTo(ch.next_chapter_id);
                    this.maybeTranslateNext(ch.next_chapter_id);
                }
            },
            async loadChapter(id) {
                const container = document.getElementById('chapter-body');
                if (!container) return;
                container.innerHTML = '<p class="text-slate-400 text-sm py-4">加载中…</p>';
                try {
                    const res = await fetch('/api/chapter/' + id);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    this.renderChapter(container, data);
                } catch (e) {
                    container.innerHTML = '<p class="text-red-500 text-sm py-4">加载失败: ' + escapeHtml(e.message) + '</p>';
                }
            },
            renderChapter(container, chapter) {
                const paras = chapter.paragraphs || [];
                const parts = paras.map((p) => {
                    const en = p.translated
                        ? escapeHtml(p.translated)
                        : '<span class="text-slate-400 not-italic">⟳ 未翻译</span>';
                    return '<div class="paragraph border-b border-slate-50 pb-4 last:border-b-0 last:pb-0" data-expanded="0">'
                        + '<p class="paragraph-zh text-slate-800 leading-loose text-base mb-2">' + escapeHtml(p.original || '') + '</p>'
                        + '<p class="paragraph-en text-base text-slate-600 italic leading-loose" data-pid="' + p.id + '">' + en + '</p>'
                        + '</div>';
                });
                container.innerHTML = parts.join('') || '<p class="text-slate-400 text-sm py-4">(空章节)</p>';
                container.dataset.loaded = '1';
            },
            canTranslate(chapterId) {
                if (this.mode === 'zh') return false;
                const ch = this.chapterStatus[chapterId];
                if (!ch) return false;
                if (ch.char_count > this.chapterMaxChars) return false;
                return ch.status === 'pending' || ch.status === 'failed';
            },
            async translateChapter(chapterId) {
                try {
                    const res = await fetch('/translate/chapter/' + chapterId, { method: 'POST' });
                    const data = await res.json().catch(() => ({}));
                    if (res.ok && (data.status === 'started' || data.status === 'too_long')) {
                        if (this.chapterStatus[chapterId]) {
                            this.chapterStatus[chapterId].status = data.status;
                        } else {
                            this.chapterStatus[chapterId] = { id: chapterId, status: data.status };
                        }
                        this.updateBadge(this.chapterStatus[chapterId]);
                    }
                } catch (e) {
                    console.error('translateChapter failed:', e);
                }
            },
            maybeTranslateNext(chapterId) {
                if (chapterId == null) return;
                if (this.mode === 'zh') return;
                const ch = this.chapterStatus[chapterId];
                if (!ch) return;
                if (ch.char_count > this.chapterMaxChars) return;
                if (ch.status === 'pending' || ch.status === 'failed' || ch.status === 'partial') {
                    this.translateChapter(chapterId);
                }
            },
            async fetchStatus() {
                try {
                    const res = await fetch('/api/chapter-status/' + this.bookId);
                    if (!res.ok) return;
                    const data = await res.json();
                    let hasPending = false;
                    for (const ch of data.chapters) {
                        this.chapterStatus[ch.id] = ch;
                        this.updateBadge(ch);
                        if (ch.status === 'pending' || ch.status === 'in_progress' || ch.status === 'partial') {
                            hasPending = true;
                        }
                    }
                    if (!hasPending && this._timer) {
                        clearInterval(this._timer);
                        this._timer = null;
                    } else if (hasPending && !this._timer) {
                        this._timer = setInterval(() => this.fetchStatus(), 3000);
                    }
                } catch (e) { /* ignore */ }
            },
            updateBadge(ch) {
                const dot = document.getElementById('cat-dot-' + ch.id);
                if (dot) {
                    dot.className = 'w-2 h-2 rounded-full flex-shrink-0 ' + this.dotClass(ch);
                }
                if (ch.id === this.activeChapterId) {
                    this.updateActiveBadge();
                }
            },
            updateActiveBadge() {
                const ch = this.chapterStatus[this.activeChapterId];
                if (!ch) return;
                const badge = document.getElementById('active-status-badge');
                const btn = document.getElementById('active-translate-btn');
                if (badge) {
                    badge.textContent = this.badgeText(ch);
                    badge.className = 'status-badge text-xs px-2 py-0.5 rounded-full font-medium ' + this.badgeClass(ch);
                }
                if (btn) {
                    btn.style.display = this.canTranslate(this.activeChapterId) ? '' : 'none';
                }
            },
            dotClass(ch) {
                if (ch.char_count > this.chapterMaxChars) return 'bg-amber-400';
                switch (ch.status) {
                    case 'done':        return 'bg-emerald-400';
                    case 'in_progress': return 'bg-blue-400 animate-pulse';
                    case 'failed':      return 'bg-red-400';
                    case 'partial':     return 'bg-amber-400';
                    case 'too_long':    return 'bg-amber-400';
                    case 'empty':       return 'bg-slate-300';
                    default:            return 'bg-slate-300';
                }
            },
            badgeText(ch) {
                if (ch.char_count > this.chapterMaxChars) {
                    return '本章过长 (' + ch.char_count.toLocaleString() + ' / ' + this.chapterMaxChars.toLocaleString() + ' 字符), 暂不支持翻译';
                }
                switch (ch.status) {
                    case 'pending':     return '未翻译';
                    case 'in_progress': return '⟳ 翻译中…';
                    case 'done':        return '✓ 已翻译';
                    case 'failed':      return '✗ 翻译失败';
                    case 'partial':     return '部分翻译 (' + ch.translated_count + '/' + ch.paragraph_count + ')';
                    case 'too_long':    return '本章过长 (' + ch.char_count.toLocaleString() + ' 字符)';
                    case 'empty':       return '空章节';
                    default:            return ch.status;
                }
            },
            badgeClass(ch) {
                if (ch.char_count > this.chapterMaxChars) return 'bg-amber-100 text-amber-700';
                switch (ch.status) {
                    case 'done':        return 'bg-emerald-100 text-emerald-700';
                    case 'in_progress': return 'bg-blue-100 text-blue-700';
                    case 'failed':      return 'bg-red-100 text-red-700';
                    case 'partial':     return 'bg-amber-100 text-amber-700';
                    case 'too_long':    return 'bg-amber-100 text-amber-700';
                    case 'empty':       return 'bg-slate-100 text-slate-500';
                    default:            return 'bg-slate-100 text-slate-500';
                }
            }
        }));
    });
</script>
{% endblock %}
