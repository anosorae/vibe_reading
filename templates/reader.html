{% extends "base.html" %}
{% block title %}{{ book.title }} - Vibe Reading{% endblock %}
{% block nav %}{% endblock %}

{% block content %}
<script>
    window.VIBE_READING = {
        bookId: {{ book.id }},
        chapterMaxChars: {{ chapter_max_chars }},
        chapters: {{ chapters | tojson | safe }},
        lastReadChapterId: {{ book.last_read_chapter_id | tojson | safe }},
    };
</script>

<div x-data="reader">
    <!-- 顶部工具栏 -->
    <div class="sticky top-0 z-20 bg-white/95 backdrop-blur border-b border-slate-100">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between gap-3">
            <div class="min-w-0 flex items-center gap-3">
                <a href="/" class="text-slate-400 hover:text-indigo-600 transition shrink-0" title="返回书架">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                </a>
                <h1 class="text-sm font-medium text-slate-700 truncate">{{ book.title }}</h1>
            </div>
            <div class="flex items-center gap-1 shrink-0">
                <button type="button" @click="switchMode('zh')"  :class="mode === 'zh'  ? 'text-indigo-600 bg-indigo-50' : 'text-slate-500 hover:text-slate-700'" class="px-2.5 py-1 text-xs font-medium rounded-md transition">中文</button>
                <button type="button" @click="switchMode('en')"  :class="mode === 'en'  ? 'text-indigo-600 bg-indigo-50' : 'text-slate-500 hover:text-slate-700'" class="px-2.5 py-1 text-xs font-medium rounded-md transition">英文</button>
                <div class="w-px h-4 bg-slate-200 mx-1"></div>
                <button type="button" @click="catalogOpen = true" class="px-2.5 py-1 text-xs font-medium text-slate-500 hover:text-indigo-600 rounded-md transition flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
                    目录
                </button>
            </div>
        </div>
    </div>

    <!-- 目录弹窗 -->
    <div x-show="catalogOpen" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100" x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
         class="fixed inset-0 z-50 flex items-center justify-center p-4" style="display:none">
        <div class="absolute inset-0 bg-black/40" @click="catalogOpen = false"></div>
        <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[80vh] flex flex-col"
             x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100">
            <div class="flex items-center justify-between px-6 py-4 border-b border-slate-100">
                <h2 class="text-base font-semibold text-slate-800">目录</h2>
                <button @click="catalogOpen = false" class="text-slate-400 hover:text-slate-600 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div class="flex-1 overflow-y-auto overscroll-contain py-2">
                <template x-for="ch in chapters" :key="ch.id">
                    <button @click="navigateTo(ch.id); catalogOpen = false"
                            :class="activeChapterId === ch.id ? 'bg-indigo-50 text-indigo-700' : 'text-slate-700 hover:bg-slate-50'"
                            class="w-full text-left px-6 py-3 flex items-center gap-3 transition">
                        <span :id="'cat-dot-' + ch.id" class="w-2 h-2 rounded-full flex-shrink-0"></span>
                        <span class="text-sm truncate" x-text="ch.title"></span>
                    </button>
                </template>
            </div>
        </div>
    </div>

    <!-- 章节内容 -->
    <div class="max-w-3xl mx-auto px-4 py-6">
        <article class="bg-white rounded-xl shadow-sm border border-slate-100">
            <header class="px-6 pt-6 pb-4 border-b border-slate-50">
                <h2 class="text-xl font-bold text-slate-800 leading-snug" x-text="currentTitle"></h2>
                <div class="mt-3 flex items-center gap-2 flex-wrap">
                    <span id="active-status-badge" class="text-xs px-2 py-0.5 rounded-full font-medium bg-slate-100 text-slate-500">加载中…</span>
                    <button id="active-translate-btn" type="button"
                            class="text-xs px-3 py-1 font-medium bg-indigo-600 text-white rounded-full hover:bg-indigo-700 transition shadow-sm"
                            style="display:none"
                            @click="translateChapter(activeChapterId)">翻译本章</button>
                </div>
            </header>

            <div id="chapter-body" class="px-6 py-6 space-y-4"></div>

            <footer class="px-6 py-4 border-t border-slate-50 flex items-center justify-between">
                <a href="#" @click.prevent="prevChapter" x-show="hasPrev"
                   class="text-sm text-slate-500 hover:text-indigo-600 transition inline-flex items-center gap-1.5 max-w-[45%]">
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                    <span class="truncate" x-text="prevTitle"></span>
                </a>
                <span x-show="!hasPrev"></span>
                <a href="#" @click.prevent="nextChapter" x-show="hasNext"
                   class="text-sm text-slate-500 hover:text-indigo-600 transition inline-flex items-center gap-1.5 max-w-[45%]">
                    <span class="truncate" x-text="nextTitle"></span>
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
                </a>
                <span x-show="!hasNext"></span>
            </footer>
        </article>
    </div>
</div>

<style>
    .zh-para { color: #1e293b; line-height: 1.9; font-size: 1rem; margin-bottom: 0.75rem; text-indent: 2em; }
    .en-para { color: #334155; line-height: 1.9; font-size: 1rem; margin-bottom: 0.5rem; cursor: pointer; }
    .en-para:hover { color: #1e293b; }
    .en-original { color: #94a3b8; line-height: 1.7; font-size: 0.9rem; margin-bottom: 1rem; padding-left: 0.75rem; border-left: 2px solid #e2e8f0; display: none; }
</style>

<script>
    function escapeHtml(s) {
        const d = document.createElement('div');
        d.appendChild(document.createTextNode(s));
        return d.innerHTML;
    }

    document.addEventListener('alpine:init', () => {
        Alpine.data('reader', () => ({
            bookId: window.VIBE_READING.bookId,
            chapterMaxChars: window.VIBE_READING.chapterMaxChars,
            chapters: window.VIBE_READING.chapters,
            mode: 'zh',
            activeChapterId: null,
            currentTitle: '',
            hasPrev: false,
            hasNext: false,
            prevTitle: '',
            nextTitle: '',
            catalogOpen: false,
            chapterStatus: {},
            _timer: null,
            _streaming: false,

            init() {
                for (const ch of this.chapters) {
                    this.chapterStatus[ch.id] = ch;
                }
                // 从服务端恢复阅读进度
                let startId = window.VIBE_READING.lastReadChapterId;
                if (!startId || !this.chapters.some(c => c.id === startId)) {
                    startId = this.chapters[0] ? this.chapters[0].id : null;
                }
                if (startId) {
                    this.navigateTo(startId);
                }
                this.fetchStatus();
            },

            navigateTo(id) {
                if (this.activeChapterId === id) return;
                this.activeChapterId = id;
                const ch = this.chapters.find(c => c.id === id);
                this.currentTitle = ch ? ch.title : '';
                // 保存阅读进度到服务端
                if (ch) {
                    fetch('/api/reading-progress/' + this.bookId, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({chapter_id: ch.id})
                    }).catch(() => {});
                }
                this.hasPrev = ch ? !!ch.prev_chapter_id : false;
                this.hasNext = ch ? !!ch.next_chapter_id : false;
                this.prevTitle = '';
                this.nextTitle = '';
                if (ch && ch.prev_chapter_id) {
                    const prev = this.chapters.find(c => c.id === ch.prev_chapter_id);
                    if (prev) this.prevTitle = prev.title;
                }
                if (ch && ch.next_chapter_id) {
                    const next = this.chapters.find(c => c.id === ch.next_chapter_id);
                    if (next) this.nextTitle = next.title;
                }
                this.updateActiveBadge();
                this.loadChapter(id);
                if (this.mode !== 'zh') {
                    this.maybeTranslateChapter(id);
                }
            },

            prevChapter() {
                const ch = this.chapters.find(c => c.id === this.activeChapterId);
                if (ch && ch.prev_chapter_id) this.navigateTo(ch.prev_chapter_id);
            },

            nextChapter() {
                const ch = this.chapters.find(c => c.id === this.activeChapterId);
                if (ch && ch.next_chapter_id) {
                    this.navigateTo(ch.next_chapter_id);
                    this.maybeTranslateNext(ch.next_chapter_id);
                }
            },

            switchMode(m) {
                if (this.mode === m) return;
                this.mode = m;
                const id = this.activeChapterId;
                if (id) {
                    this.loadChapter(id);
                    if (m !== 'zh') this.maybeTranslateChapter(id);
                }
            },

            async loadChapter(id) {
                const container = document.getElementById('chapter-body');
                if (!container) return;
                container.innerHTML = '<p class="text-slate-400 text-sm py-8 text-center">加载中…</p>';
                try {
                    const res = await fetch('/api/chapter/' + id);
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const data = await res.json();
                    this.renderChapter(container, data);
                } catch (e) {
                    container.innerHTML = '<p class="text-red-400 text-sm py-8 text-center">加载失败: ' + escapeHtml(e.message) + '</p>';
                }
            },

            renderChapter(container, chapter) {
                const content = chapter.content || '';
                const translated = chapter.translated_content || '';

                if (this.mode === 'zh') {
                    this.renderZh(container, content);
                } else {
                    this.renderEn(container, content, translated);
                }
            },

            renderZh(container, content) {
                const lines = content.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
                if (!lines.length) {
                    container.innerHTML = '<p class="text-slate-400 text-sm py-8 text-center">(空章节)</p>';
                    return;
                }
                container.innerHTML = lines.map(p =>
                    '<p class="zh-para">' + escapeHtml(p) + '</p>'
                ).join('');
            },

            renderEn(container, content, translated) {
                if (!translated) {
                    container.innerHTML = '<p class="text-slate-400 text-sm py-8 text-center">翻译中…</p>';
                    return;
                }
                // Split Chinese into paragraphs (by \n\n, matching parser output)
                const cnParas = content.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);

                // Parse ALL [N] markers throughout the entire translation
                const parsed = [];
                const regex = /\[(\d+)\]\s*/g;
                let match;
                let lastIndex = 0;
                while ((match = regex.exec(translated)) !== null) {
                    // Save text for previous marker
                    if (parsed.length > 0) {
                        parsed[parsed.length - 1].text = translated.slice(lastIndex, match.index).trim();
                    }
                    parsed.push({ marker: parseInt(match[1]), text: '' });
                    lastIndex = match.index + match[0].length;
                }
                if (parsed.length > 0) {
                    parsed[parsed.length - 1].text = translated.slice(lastIndex).trim();
                } else {
                    // No markers found, fallback: show all as one block
                    parsed.push({ marker: null, text: translated.trim() });
                }

                // Render each paragraph with its paired CN original
                const blocks = [];
                for (const ep of parsed) {
                    const enHtml = escapeHtml(ep.text);
                    let cnHtml = '';
                    if (ep.marker !== null && ep.marker >= 1 && ep.marker <= cnParas.length) {
                        cnHtml = escapeHtml(cnParas[ep.marker - 1]);
                    }
                    blocks.push(
                        '<p class="en-para" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display===\'block\'?\'none\':\'block\'">'
                        + enHtml + '</p>'
                        + '<p class="en-original">' + cnHtml + '</p>'
                    );
                }
                container.innerHTML = blocks.join('');
            },

            _renderZhFallback(content) {
                const lines = content.split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
                return lines.map(p =>
                    '<p class="zh-para">' + escapeHtml(p) + '</p>'
                ).join('');
            },

            canTranslate(chapterId) {
                if (this.mode === 'zh') return false;
                if (this._streaming) return false;
                const ch = this.chapterStatus[chapterId];
                if (!ch) return false;
                return ch.status !== 'done' && ch.status !== 'empty';
            },
            async translateChapter(chapterId) {
                if (this._streaming) return;
                this._streaming = true;
                const container = document.getElementById('chapter-body');

                // 标记为翻译中
                if (this.chapterStatus[chapterId]) {
                    this.chapterStatus[chapterId].status = 'in_progress';
                }
                this.updateActiveBadge();

                let accumulated = '';
                try {
                    const res = await fetch('/translate/stream/' + chapterId, { method: 'POST' });
                    if (!res.ok) {
                        const err = await res.json().catch(() => ({}));
                        throw new Error(err.detail || err.reason || 'HTTP ' + res.status);
                    }
                    const reader = res.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop();

                        for (const line of lines) {
                            if (!line.startsWith('data: ')) continue;
                            let evt;
                            try { evt = JSON.parse(line.slice(6)); } catch { continue; }

                            if (evt.type === 'chunk') {
                                accumulated += evt.text;
                                if (container) {
                                    container.innerHTML = '<pre class="text-slate-600 text-sm leading-relaxed whitespace-pre-wrap font-sans">' + escapeHtml(accumulated) + '</pre>';
                                }
                            } else if (evt.type === 'error') {
                                throw new Error(evt.reason);
                            }
                        }
                    }

                    // 流结束, 重新加载章节 (显示正式双语渲染)
                    this._streaming = false;
                    if (this.chapterStatus[chapterId]) {
                        this.chapterStatus[chapterId].status = 'done';
                    }
                    this.updateActiveBadge();
                    this.loadChapter(chapterId);

                } catch (e) {
                    console.error('translateChapter failed:', e);
                    this._streaming = false;
                    if (this.chapterStatus[chapterId]) {
                        this.chapterStatus[chapterId].status = 'failed';
                    }
                    this.updateActiveBadge();
                    if (container) {
                        container.innerHTML = '<p class="text-red-400 text-sm py-8 text-center">翻译失败: ' + escapeHtml(e.message) + '</p>';
                    }
                }
            },
            maybeTranslateNext(chapterId) {
                if (chapterId == null) return;
                if (this.mode === 'zh') return;
                if (this._streaming) return;
                const ch = this.chapterStatus[chapterId];
                if (!ch) return;
                if (ch.char_count > this.chapterMaxChars) return;
                if (ch.status === 'pending' || ch.status === 'failed') {
                    this.translateChapter(chapterId);
                }
            },
            maybeTranslateChapter(chapterId) {
                if (chapterId == null) return;
                if (this._streaming) return;
                const ch = this.chapterStatus[chapterId];
                if (!ch) return;
                if (ch.char_count > this.chapterMaxChars) return;
                if (ch.status === 'in_progress' || ch.status === 'done') return;
                if (ch.status === 'pending' || ch.status === 'failed') {
                    this.translateChapter(chapterId);
                }
            },
            async fetchStatus() {
                try {
                    const res = await fetch('/api/chapter-status/' + this.bookId);
                    if (!res.ok) return;
                    const data = await res.json();
                    let hasPending = false;
                    for (const ch of data.chapters) {
                        const prev = this.chapterStatus[ch.id];
                        this.chapterStatus[ch.id] = ch;
                        if (!prev || prev.status !== ch.status) {
                            this.updateBadge(ch);
                            if (ch.id === this.activeChapterId && ch.status === 'done' && prev && prev.status !== 'done') {
                                this.loadChapter(ch.id);
                            }
                        }
                        if (ch.status === 'pending' || ch.status === 'in_progress') {
                            hasPending = true;
                        }
                    }
                    if (!hasPending && this._timer) {
                        clearInterval(this._timer);
                        this._timer = null;
                    } else if (hasPending && !this._timer) {
                        this._timer = setInterval(() => this.fetchStatus(), 3000);
                    }
                } catch (e) { /* ignore */ }
            },
            updateBadge(ch) {
                const dot = document.getElementById('cat-dot-' + ch.id);
                if (dot) {
                    dot.className = 'w-2 h-2 rounded-full flex-shrink-0 ' + this.dotClass(ch);
                }
                if (ch.id === this.activeChapterId) {
                    this.updateActiveBadge();
                }
            },
            updateActiveBadge() {
                const ch = this.chapterStatus[this.activeChapterId];
                if (!ch) return;
                const badge = document.getElementById('active-status-badge');
                const btn = document.getElementById('active-translate-btn');
                if (badge) {
                    badge.textContent = this.badgeText(ch);
                    badge.className = 'text-xs px-2 py-0.5 rounded-full font-medium ' + this.badgeClass(ch);
                }
                if (btn) {
                    btn.style.display = this.canTranslate(this.activeChapterId) ? '' : 'none';
                }
            },
            dotClass(ch) {
                if (ch.char_count > this.chapterMaxChars) return 'bg-amber-400';
                switch (ch.status) {
                    case 'done':        return 'bg-emerald-400';
                    case 'in_progress': return 'bg-blue-400';
                    case 'failed':      return 'bg-red-400';
                    case 'too_long':    return 'bg-amber-400';
                    case 'empty':       return 'bg-slate-300';
                    default:            return 'bg-slate-300';
                }
            },
            badgeText(ch) {
                if (ch.char_count > this.chapterMaxChars) {
                    return '本章过长 (' + ch.char_count.toLocaleString() + ' / ' + this.chapterMaxChars.toLocaleString() + ' 字符)';
                }
                switch (ch.status) {
                    case 'pending':     return '未翻译';
                    case 'in_progress': return '翻译中…';
                    case 'done':        return '已翻译';
                    case 'failed':      return '翻译失败';
                    case 'too_long':    return '本章过长 (' + ch.char_count.toLocaleString() + ' 字符)';
                    case 'empty':       return '空章节';
                    default:            return ch.status;
                }
            },
            badgeClass(ch) {
                if (ch.char_count > this.chapterMaxChars) return 'bg-amber-50 text-amber-600';
                switch (ch.status) {
                    case 'done':        return 'bg-emerald-50 text-emerald-600';
                    case 'in_progress': return 'bg-blue-50 text-blue-600';
                    case 'failed':      return 'bg-red-50 text-red-600';
                    case 'too_long':    return 'bg-amber-50 text-amber-600';
                    case 'empty':       return 'bg-slate-50 text-slate-400';
                    default:            return 'bg-slate-50 text-slate-400';
                }
            }
        }));
    });
</script>
{% endblock %}
